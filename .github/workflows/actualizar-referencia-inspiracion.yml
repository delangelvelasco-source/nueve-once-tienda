name: Mejorar detalles con referencia de inspiración

on:
  push:
    paths-ignore:
      - 'index.html'
      - '.github/workflows/actualizar-referencia-inspiracion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar modal de detalles
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css = r'''
          /* Referencia de inspiración: visual discreto y separado del producto Nueve Once */
          .modalbox{max-width:980px!important;grid-template-columns:1fr!important;gap:18px!important;align-items:start!important}
          #modalcontent{display:grid;grid-template-columns:.9fr 1.1fr;gap:26px;align-items:start}
          .modal-reference{margin-top:18px;border:1px solid #dbe5e3;border-radius:16px;background:#f7f8f6;padding:14px}
          .modal-reference-head{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
          .modal-reference-title{font-weight:800;color:var(--deep);font-size:13px}
          .modal-reference-sub{font-size:11px;color:#657370;margin-top:3px;line-height:1.4}
          .modal-reference-body{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #dbe5e3}
          .modal-reference.open .modal-reference-body{display:block}
          .reference-note{background:#eef5f3;border-radius:12px;padding:11px 12px;color:#536360;font-size:11px;line-height:1.5}
          .reference-link{display:inline-flex;align-items:center;gap:7px;margin-top:10px;background:white;border:1px solid #cbdad7;color:var(--deep);padding:9px 12px;border-radius:10px;text-decoration:none;font-weight:800;font-size:11px}
          .reference-label{display:inline-block;color:var(--gold);font-weight:800;font-size:10px;letter-spacing:.12em;margin-bottom:6px}
          @media(max-width:680px){#modalcontent{grid-template-columns:1fr}.modalbox{padding:18px!important}.modalimg{height:300px}}
          '''
          if '/* Referencia de inspiración: visual discreto' not in html:
              html = html.replace('</style>', css + '\n</style>', 1)

          new_show = r'''function referenceUrl(p){
            const b=(p.brand||'').toUpperCase();
            const map={
              'VALENTINO':'https://www.valentino-beauty.us/fragrances/fragrances-women/fragrances-women-voce',
              'CHANEL':'https://www.chanel.com/mx/perfumes/',
              'DIOR':'https://www.dior.com/es_mx/beauty/fragrance/fragrance-homepage.html',
              'BVLGARI':'https://www.bulgari.com/es-mx/perfumes',
              'GUCCI':'https://www.gucci.com/mx/es_mx/st/capsule/beauty/fragrances',
              'VERSACE':'https://www.versace.com/mx/es/perfumes/',
              'YSL':'https://www.yslbeautyus.com/fragrance',
              'PRADA':'https://www.prada-beauty.com/fragrance',
              'BURBERRY':'https://us.burberry.com/c/beauty/fragrance/',
              'HERMÈS':'https://www.hermes.com/mx/es/category/perfumes/',
              'MUGLER':'https://www.mugler.com/fragrance',
              'CREED':'https://www.creedfragrance.com/',
              'JO MALONE':'https://www.jomalone.com.mx/',
              'PARFUMS DE MARLY':'https://parfums-de-marly.com/',
              'JEAN PAUL GAULTIER':'https://www.jeanpaulgaultier.com/ww/en/p/fragrances'
            };
            return map[b] || ('https://www.google.com/search?q='+encodeURIComponent((p.brand||'')+' '+(p.inspiration||'')+' perfume'));
          }
          function showDetail(p){
            const img=p.category==="HOMBRE"?"hombre.PNG":"mujer.PNG";
            const refUrl=referenceUrl(p);
            document.getElementById("modalcontent").innerHTML=`
              <div>
                <img class="modalimg" src="${img}" alt="${esc(p.name)} Nueve Once">
              </div>
              <div>
                <div class="cat">${esc(p.category)}</div>
                <h2 style="color:var(--deep);font-family:Georgia,serif;font-size:34px;margin:8px 0 12px">${esc(p.name)}</h2>
                <p><b>Inspiración:</b> ${esc(p.inspiration)}</p>
                <p><b>Marca de referencia:</b> ${esc(p.brand)}</p>
                <div class="price" style="font-size:25px;margin:18px 0">$300.00 MXN</div>
                <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px">
                  <button onclick='addToCart(${JSON.stringify(p)})' class="add" style="border:0;border-radius:11px;padding:12px 18px;cursor:pointer;font-weight:800">Agregar a mi bolsa</button>
                </div>
                <div class="reference-note"><b>Fragancia de inspiración</b><br>Nuestras fragancias son creaciones de Nueve Once inspiradas en referencias olfativas reconocidas. No estamos afiliados, asociados ni respaldados por las marcas mencionadas.</div>
                <div class="notes" style="margin-top:16px"><b>Notas aromáticas</b><br>${esc(p.notes)}</div>
                <div class="modal-reference" id="referenceBox">
                  <div class="modal-reference-head" onclick="document.getElementById('referenceBox').classList.toggle('open')">
                    <div><div class="reference-label">REFERENCIA DE INSPIRACIÓN</div><div class="modal-reference-title">Consultar referencia visual de ${esc(p.inspiration)}</div><div class="modal-reference-sub">Se muestra de forma discreta y separada del producto Nueve Once.</div></div>
                    <span style="font-size:18px;color:var(--deep)">⌄</span>
                  </div>
                  <div class="modal-reference-body">
                    <div class="reference-note">La imagen o producto de referencia pertenece a su respectiva marca y se utiliza únicamente como guía de inspiración. Nueve Once no reclama propiedad sobre esa marca ni sobre sus imágenes.</div>
                    <a class="reference-link" href="${refUrl}" target="_blank" rel="noopener noreferrer">Ver referencia en el sitio de la marca ↗</a>
                  </div>
                </div>
              </div>`;
            document.getElementById("modal").classList.add("open");
          }
          '''

          pattern = re.compile(r'function showDetail\(p\)\{.*?\}\s*function checkout\(\)', re.S)
          if pattern.search(html):
              html = pattern.sub(new_show + '\nfunction checkout()', html, count=1)
          else:
              raise SystemExit('No se encontró la función showDetail para actualizarla.')

          path.write_text(html, encoding='utf-8')
          print('Modal actualizado correctamente.')

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Mostrar referencia de inspiración de forma discreta"
          git push
