name: Fijar botones de detalle

on:
  push:
    paths:
      - 'trigger-detail-fix.txt'
      - '.github/workflows/fijar-botones-detalle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corregir eventos de productos
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          pattern = re.compile(r'function render\(\)\{.*?\}\s*function addToCart\(p\)', re.S)
          replacement = r'''function render(){
            const arr=filtered();
            document.getElementById("grid").innerHTML=arr.map((p,i)=>{
              const image=p.category==="HOMBRE"?"hombre.PNG":p.category==="MUJER"?"mujer.PNG":null;
              const visual=image?`<img src="${image}" alt="${esc(p.name)} Nueve Once" loading="lazy">`:`<img src="mujer.PNG" alt="Nueve Once Mujer 30 ml" loading="lazy"><img src="hombre.PNG" alt="Nueve Once Hombre 30 ml" loading="lazy">`;
              return `<article class="card"><div class="product-visual ${image?'':'dual-image'}">${p.new?'<span class="new">NUEVO</span>':''}${visual}</div><div class="cardbody"><div class="cat">${esc(p.category)}</div><h3>${esc(p.name)}</h3><div class="insp"><b>Inspiración:</b> ${esc(p.inspiration)} · ${esc(p.brand)}</div><div class="notes">${esc(p.notes)}</div><div class="price">$300.00 MXN</div><div class="actions"><button class="details" type="button" data-detail-index="${i}">Detalles</button><button class="add" type="button" data-add-index="${i}">Agregar</button></div></div></article>`;
            }).join("")||'<p>No encontramos fragancias con esa búsqueda.</p>';

            document.querySelectorAll('[data-detail-index]').forEach(btn=>{
              btn.onclick=()=>showDetail(filtered()[Number(btn.dataset.detailIndex)]);
            });
            document.querySelectorAll('[data-add-index]').forEach(btn=>{
              btn.onclick=()=>addToCart(filtered()[Number(btn.dataset.addIndex)]);
            });
          }
          function addToCart(p)'''

          html2, n = pattern.subn(replacement, html, count=1)
          if n != 1:
              raise SystemExit('No se encontró la función render.')
          html = html2

          html = html.replace(
              '<button onclick=\'addToCart(${JSON.stringify(p)})\' class="add"',
              '<button id="modalAddButton" class="add"'
          )
          marker = 'document.getElementById("modal").classList.add("open");'
          inject = '''document.getElementById("modal").classList.add("open");
            const modalAdd=document.getElementById("modalAddButton");
            if(modalAdd) modalAdd.onclick=()=>addToCart(p);'''
          html = html.replace(marker, inject, 1)

          # Cargar una capa independiente de blindaje de eventos.
          script = '<script src="fix-detail-buttons.js?v=2"></script>'
          if script not in html:
              html = html.replace('</body>', script + '\n</body>', 1)

          path.write_text(html, encoding='utf-8')
          print('Botones de detalle corregidos y blindaje cargado.')

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Blindar interacciones del catálogo"
          git push
