name: Activar ficha gráfica de referencia

on:
  push:
    paths:
      - 'reference-visual.js'
      - 'reference-visual.css'
      - '.github/workflows/instalar-referencia-grafica.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrar archivos en index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'reference-visual.css' not in s:
              s=s.replace('</head>', '  <link rel="stylesheet" href="reference-visual.css">\n</head>')
          if 'reference-visual.js' not in s:
              s=s.replace('</body>', '  <script src="reference-visual.js"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Mostrar ficha gráfica de referencia de inspiración'
          git push
