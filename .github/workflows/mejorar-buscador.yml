name: Mejorar buscador Nueve Once
on:
  push:
    paths:
      - 'buscador-update.txt'
      - '.github/workflows/mejorar-buscador.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mejorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mejorar buscador
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old_input = '<input id="search" class="search" placeholder="Buscar perfume, inspiración o marca…" autocomplete="off">'
          new_input = '<div class="search-wrap"><input id="search" class="search" placeholder="Buscar por nombre, inspiración, marca, notas o categoría…" autocomplete="off" aria-label="Buscar perfumes"><div id="searchSuggestions" class="search-suggestions" role="listbox"></div></div>'
          if old_input in html:
              html = html.replace(old_input, new_input, 1)

          css_anchor = '.search{background:#fff;border:1px solid #d3dfdd;border-radius:14px;padding:13px 15px;outline:none;width:100%}'
          css_extra = '.search-wrap{position:relative;width:100%}.search-suggestions{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:35;background:#fff;border:1px solid #d3dfdd;border-radius:14px;box-shadow:0 12px 30px rgba(7,63,58,.12);overflow:hidden;display:none}.search-suggestions.open{display:block}.search-suggestion{display:flex;justify-content:space-between;gap:12px;width:100%;border:0;background:#fff;padding:11px 14px;text-align:left;color:var(--deep);cursor:pointer}.search-suggestion:hover,.search-suggestion:focus{background:var(--soft);outline:none}.search-suggestion small{color:#657370;white-space:nowrap}.search-empty{padding:12px 14px;color:#657370;font-size:12px}'
          if css_anchor in html and '.search-wrap{' not in html:
              html = html.replace(css_anchor, css_anchor + css_extra, 1)

          old_get = '''function getFiltered(){\n const q=$("search").value||"";'''
          if old_get in html:
              pass

          marker = '''function renderFilters(){'''
          search_functions = r'''function searchableText(p){
 return [p.name,p.inspiration,p.brand,p.notes,p.category].filter(Boolean).join(" ").toLowerCase();
}
function renderSearchSuggestions(){
 const box=$("searchSuggestions");
 if(!box)return;
 const q=($("search").value||"").toLowerCase().trim();
 if(!q){box.classList.remove("open");box.innerHTML="";return;}
 const matches=PRODUCTS.filter(p=>searchableText(p).includes(q)).slice(0,6);
 box.innerHTML=matches.length?matches.map(p=>`<button type="button" class="search-suggestion" data-search-id="${p._id}"><span><b>${esc(p.name)}</b><br><small>${esc(p.category)} · ${esc(p.brand||"")}</small></span><small>${esc(p.inspiration||"")}</small></button>`).join(""):"<div class="search-empty">No encontramos coincidencias. Prueba con otra palabra.</div>";
 box.classList.add("open");
}
function renderFilters(){'''
          if marker in html and 'function renderSearchSuggestions()' not in html:
              html = html.replace(marker, search_functions, 1)

          old_listener = '$("search").addEventListener("input",render);$("sort").addEventListener("change",render);'
          new_listener = '''$("search").addEventListener("input",()=>{render();renderSearchSuggestions();});$("sort").addEventListener("change",render);
if($("searchSuggestions")){
 $("searchSuggestions").addEventListener("click",e=>{const b=e.target.closest("[data-search-id]");if(!b)return;const p=PRODUCTS.find(x=>x._id===Number(b.dataset.searchId));if(!p)return;$("search").value=p.name;$("searchSuggestions").classList.remove("open");render();showDetail(p);});
 document.addEventListener("click",e=>{if(!e.target.closest(".search-wrap"))$("searchSuggestions").classList.remove("open");});
}'''
          if old_listener in html:
              html = html.replace(old_listener, new_listener, 1)

          path.write_text(html, encoding='utf-8')
      - name: Publicar cambios y limpiar trigger
        shell: bash
        run: |
          rm -f buscador-update.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html buscador-update.txt .github/workflows/mejorar-buscador.yml
          git commit -m "Mejorar buscador del catálogo" || exit 0
          git push
