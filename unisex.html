<title>Nueve Once | Unisex — En mantenimiento</title>
<style>
:root{--accent:#5f6f68;--soft:#e8ece8;--ink:#243331}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e8ece8;color:var(--ink)}
body{display:grid;place-items:center;padding:24px}

h1{font:700 clamp(36px,8vw,58px)/.95 Georgia,serif;margin:22px 0 14px;color:var(--accent)}
p{font-size:16px;line-height:1.65;color:#65716e;margin:0 auto;max-width:480px}
.date{margin-top:24px;font-size:13px;font-weight:800;color:var(--accent)}
a{display:inline-flex;margin-top:30px;text-decoration:none;background:var(--accent);color:#fff;padding:13px 20px;border-radius:999px;font-weight:800}
small{display:block;margin-top:20px;color:#929b98;font-size:11px}
